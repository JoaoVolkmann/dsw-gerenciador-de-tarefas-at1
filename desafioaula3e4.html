<!DOCTYPE html>
<html lang="pt-BR">
<head>
 <meta charset="UTF-8">
 <meta name="viewport" content="width=device-width, initial-scale=1.0">
 <title>Desafio Card Responsivo</title>
 <!-- Tailwind CSS via Play CDN -->
 <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-50 min-h-screen font-sans antialiased flex items-center justify-center p-4">

 <!-- INÍCIO DO CARD -->
 <div class="max-w-md md:max-w-2xl w-full bg-white border border-slate-200 rounded-xl shadow-sm p-6">

     <!-- Container de Layout -->
     <div class="flex flex-col items-center gap-4 md:flex md:flex-row md:items-start md:gap-6">

         <!-- Avatar (Área do Círculo) -->
         <div class="w-16 h-16 shrink-0 rounded-full bg-slate-900 text-white flex items-center justify-center font-bold text-lg">
             JS
         </div>

         <!-- Informações do Depoimento -->
         <div class="flex flex-col items-center text-center md:items-start md:text-left gap-1">
             <h1 class="text-base font-bold text-slate-900">João Volkmann</h1>
             <span class="text-xs font-semibold text-emerald-600 uppercase tracking-wider">Desenvolvedor Front-end</span>
             <p class="text-sm text-slate-600 mt-2">"Código que não é responsivo não é código pronto — é só a metade do trabalho."</p>

             <button class="mt-4 px-4 py-2 rounded-lg border border-slate-200 text-sm font-medium text-slate-700 transition-colors hover:bg-slate-50">
                 Ver Perfil
             </button>
         </div>

     </div>
 </div>

</body>
</html>
