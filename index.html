<header>

  </header>
  <header>
    <main>
        <!--seção de formularios-->
        <section>
            <h2>
                Criar Novas Tarefas

                <div>
                    <label for="input-titulo">Titulo da Atividade </label>
                    <input type="text" id="input-titulo" required placeholder="Digite o nome da Atividade....">
                </div>
                <div> 
                    <label for-"select-prioridade">Prioridade:</label>
                    <select id="select-prioridade"></select>
                    <option> value="low">baixa</option>
                    <option> value= "medium">media </option>
                    <option> value = "hight">alta</option>
                </div>
                <button type="submit">Cadastrar</button>

            </form>
        </section>
         <div>
            <input type="checkbox">
         </div>
    </main>
  </header>
